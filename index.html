<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Unitflow - Unit Converter</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header>
        <div class="logo">Unit<span>Flow</span></div>
        <nav>
            
            <a href="#converter">converter</a>
            <a href="#about">About</a>
        </nav>
    </header>
    <section class="hero">
        <h1>Convert any unit to any unit</h1>
<p>Length, Weight, Speed, Volume and Temperature.</p>
</section>
        <main id="converter">
            <div class="tabs" id="tabs"></div>
            <div class="panel">
            <div class="field">
                <label>from</label>
                <input id="value" type="number" value="1">
                <select id="from"></select>
                </div>
                <button class="swap" id="swap" title="swap"></button>
                <div class="field">
                <label>To</label>
                <div class="result" id="result"></div>
                <select id="to"></select>
            </div>
        </div>

        </main>
        <section id="about" class="about">
        <h2>About</h2>
        <p> This is a simple place where you can convert your units for free!!!!!!!!!!!!!!!!!!!!!!!!</p>
    </section>
<footer> Built with html,css,java</footer>
<script src="script.js"></script>
</body>
</html>
